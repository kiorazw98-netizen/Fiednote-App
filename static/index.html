<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fa">
  <title>Fieldnote — Business manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/theme.css">
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#" aria-label="Fieldnote home"><span class="brand-mark">f</span><span>fieldnote<span class="brand-dot">.</span></span></a>
    <div class="workspace-label">WORKSPACE</div>
    <nav class="navigation" aria-label="Main navigation">
      <button class="nav-link active" data-page="dashboard"><span class="nav-icon">◫</span>Overview</button>
      <div class="nav-group-label">MANAGE</div>
      <button class="nav-link" data-page="customers"><span class="nav-icon">♙</span>Customers</button>
      <button class="nav-link" data-page="products"><span class="nav-icon">▦</span>Products</button>
      <button class="nav-link" data-page="sales"><span class="nav-icon">↗</span>Sales</button>
      <button class="nav-link" data-page="expenses"><span class="nav-icon">↙</span>Expenses</button>
      <div class="nav-group-label">INSIGHTS</div>
      <button class="nav-link" data-page="reports"><span class="nav-icon">▥</span>Reports</button>
    </nav>
    <div class="sidebar-bottom">
      <div class="help-card"><div class="help-icon">✳</div><strong>Your business, in focus.</strong><p>Keep the details organized so you can focus on the bigger picture.</p></div>
      <div class="profile"><div class="avatar">FN</div><div class="profile-copy"><strong>My business</strong><span>Owner account</span></div><span class="profile-menu">···</span></div>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <button class="mobile-menu icon-button" id="menu-button" aria-label="Toggle menu">☰</button>
      <div class="breadcrumbs">Workspace <span>/</span> <strong id="breadcrumb">Overview</strong></div>
      <div class="topbar-right"><span class="today-label" id="today-label"></span><div class="top-avatar">FN</div></div>
    </header>
    <div class="page-content" id="page-content" aria-live="polite"></div>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <div id="modal-root"></div>
  <script src="/app.js" defer></script>
</body>
</html>
